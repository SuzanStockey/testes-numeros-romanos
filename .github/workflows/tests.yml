name: Testes e cobertura

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Testes e cobertura do conversor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: tests-badges-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Executar suíte padrão e gerar cobertura
        run: mvn --batch-mode --no-transfer-progress -Pcoverage clean verify
      - name: Resumir testes e cobertura
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('target/surefire-reports').glob('TEST-*.xml'))
          totals = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, 0))
          lines = ['## Suíte padrão', '', '| Itens | Falhas | Erros | Ignorados |', '|---|---|---|---|', '| {tests} | {failures} | {errors} | {skipped} |'.format(**totals)]
          coverage = Path('target/site/jacoco/jacoco.xml')
          if coverage.exists():
              lines += ['', '## Cobertura do conversor', '', '| Métrica | Cobertos | Total | Cobertura |', '|---|---|---|---|']
              for counter in ET.parse(coverage).getroot().findall('counter'):
                  if counter.get('type') in ('LINE', 'BRANCH'):
                      covered, missed = int(counter.get('covered')), int(counter.get('missed'))
                      total = covered + missed
                      percent = 100 * covered / total if total else 100
                      label = {'LINE': 'Linhas', 'BRANCH': 'Ramificações'}[counter.get('type')]
                      lines.append(f'| {label} | {covered} | {total} | {percent:.1f}% |')
              lines += ['', 'Cobertura refere-se à suíte padrão, sem a checagem exaustiva. Não constitui prova de correção.']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('\n'.join(lines) + '\n')
      - name: Disponibilizar relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testes-e-cobertura
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 30
          if-no-files-found: warn

      - name: Gerar dados dos badges
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          out = Path('.badge-data')
          out.mkdir(exist_ok=True)
          def badge(name, label, message, color):
              (out / (name + '.json')).write_text(json.dumps(dict(schemaVersion=1, label=label, message=message, color=color, cacheSeconds=300)), encoding='utf-8')
          reports = list(Path('target/surefire-reports').glob('TEST-*.xml'))
          count = failures = errors = 0
          for report in reports:
              root = ET.parse(report).getroot()
              count += int(root.get('tests', 0))
              failures += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))
          badge('tests', 'testes', f'{count} itens / {failures + errors} falhas' if reports else 'indisponível', 'brightgreen' if reports and not failures + errors else 'red')
          report = Path('target/site/jacoco/jacoco.xml')
          counters = {c.get('type'): c for c in ET.parse(report).getroot().findall('counter')} if report.exists() else {}
          for name, label, metric in [('lines', 'linhas', 'LINE'), ('branches', 'ramificações', 'BRANCH')]:
              if metric in counters:
                  c = counters[metric]
                  covered, missed = int(c.get('covered')), int(c.get('missed'))
                  value = 100 * covered / (covered + missed) if covered + missed else 100
                  badge(name, label, f'{value:.1f}%', 'brightgreen' if value >= 90 else 'orange')
              else:
                  badge(name, label, 'indisponível', 'lightgrey')
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          java = ET.parse('pom.xml').getroot().find('m:properties/m:maven.compiler.release', ns).text
          badge('java', 'Java', java, 'blue')
      - name: Disponibilizar dados dos badges
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: badge-data
          path: .badge-data/*.json
          include-hidden-files: true

  badges:
    name: Publicar indicadores automáticos
    needs: tests
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-badges
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/download-artifact@v7
        with:
          name: badge-data
          path: .badge-data
      - name: Publicar badges da branch principal
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin refs/heads/ci-badges >/dev/null 2>&1; then
            git fetch origin ci-badges
            git checkout -B ci-badges FETCH_HEAD
          else
            git checkout --orphan ci-badges
            git rm -r --cached --quiet -- .
          fi
          cp .badge-data/*.json .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lines.json branches.json tests.json java.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza indicadores automáticos"
            git push origin HEAD:ci-badges
          fi

  exhaustive:
    name: Checagem exaustiva separada
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Conferir os 3999 valores nos dois sentidos
        run: mvn --batch-mode --no-transfer-progress test -Dtest=RomanExhaustiveTest -DexcludedGroups=none
      - name: Disponibilizar relatório exaustivo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checagem-exaustiva
          path: target/surefire-reports/
          retention-days: 30
          if-no-files-found: warn
